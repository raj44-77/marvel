<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="icon" type="image/png" href="/assets/images/marvel-logo.png" />
<title>MARVEL � Sign Up</title>
<meta name="description" content="MARVEL � Create your private network identity." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/global.css" />
<link rel="stylesheet" href="/css/components.css" />
<link rel="stylesheet" href="/css/signup.css" />
</head>
<body>
<div class="grid-bg"></div>
<div class="ambient a1"></div>
<div class="ambient a2"></div>
<div class="signup">
  <div class="signup-card glass">
    <div class="hud-ring small">
      <span></span><span></span><span></span>
    </div>
    <div class="wordmark xl">MARVEL<i></i></div>
    <p class="mono sub">CREATE YOUR IDENTITY</p>
    <p class="motto">No feeds. No stories. No distractions.<br>Just you and the people who matter.</p>
    <label class="field">
      <span class="mono lbl">DISPLAY NAME</span>
      <input id="signupName" type="text" placeholder="Tony Stark" autocomplete="off" maxlength="50" />
    </label>
    <label class="field">
      <span class="mono lbl">PHONE NUMBER</span>
      <input id="signupPhone" type="tel" placeholder="+91 98765 43210" autocomplete="off" maxlength="15" />
    </label>
    <label class="field">
      <span class="mono lbl">PASSWORD</span>
      <input id="signupPassword" type="password" placeholder="Min 6 characters" autocomplete="off" maxlength="100" />
    </label>
    <label class="field">
      <span class="mono lbl">USERNAME <span class="optional">(OPTIONAL)</span></span>
      <input id="signupUsername" type="text" placeholder="@username" autocomplete="off" maxlength="30" />
    </label>
    <label class="field">
      <span class="mono lbl">STATUS <span class="optional">(OPTIONAL)</span></span>
      <input id="signupStatus" type="text" placeholder="What's on your mind?" autocomplete="off" maxlength="100" />
    </label>
    <p class="error-msg hidden" id="signupError"></p>
    <button class="btn primary block" id="signupBtn">
      <span id="signupBtnText">CREATE IDENTITY</span>
      <span class="spinner hidden" id="signupSpinner"></span>
    </button>
    <p class="hint">Your data stays private � Encrypted</p>
    <p class="link-row">
      Already have an identity? <a href="/pages/login.html">Enter network</a>
    </p>
    <div class="mono foot-node">STARK INDUSTRIES // SECURE REGISTRATION</div>
  </div>
</div>
<div class="toasts" id="toasts"></div>
<script src="/js/app.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
