<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="icon" type="image/png" href="/assets/images/marvel-logo.png" />
<title>MARVEL � Login</title>
<meta name="description" content="MARVEL � Private Communication Network. Secure login." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/global.css" />
<link rel="stylesheet" href="/css/components.css" />
<link rel="stylesheet" href="/css/login.css" />
</head>
<body>
<div class="grid-bg"></div>
<div class="ambient a1"></div>
<div class="ambient a2"></div>
<div class="login">
  <div class="login-card glass">
    <div class="hud-ring small">
      <span></span><span></span><span></span>
    </div>
    <div class="wordmark xl">MARVEL<i></i></div>
    <p class="mono sub">PRIVATE COMMUNICATION NETWORK</p>
    <label class="field">
      <span class="mono lbl">PHONE NUMBER</span>
      <input id="loginPhone" type="tel" placeholder="+91 98765 43210" autocomplete="off" maxlength="15" />
    </label>
    <label class="field">
      <span class="mono lbl">PASSWORD</span>
      <input id="loginPassword" type="password" placeholder="Enter password" autocomplete="off" maxlength="100" />
    </label>
    <p class="error-msg hidden" id="loginError">Please enter a valid phone number</p>
    <button class="btn primary block" id="loginBtn">
      <span id="loginBtnText">ENTER NETWORK</span>
      <span class="spinner hidden" id="loginSpinner"></span>
    </button>
    <p class="hint">Private network � Personal use</p>
    <p class="link-row">
      New user? <a href="/pages/signup.html">Create identity</a>
    </p>
    <div class="mono foot-node">STARK INDUSTRIES // PRIVATE NODE</div>
  </div>
</div>
<div class="toasts" id="toasts"></div>
<script src="/js/app.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
